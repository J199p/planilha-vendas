<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RG OLIVEIRA PRO V3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f1115;color:#fff;padding:10px}
.header{background:linear-gradient(135deg,#ff6a00,#ff9a3c);padding:15px;border-radius:12px;text-align:center}
.card{background:#1a1d24;border-radius:12px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{text-align:center;padding:10px;background:#22252f;border-radius:10px}
.kpi b{display:block;color:#ff6a00;font-size:18px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;background:#ff6a00;color:#fff;margin-top:8px}
.btn-green{background:#00e676;color:#000}
.input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#fff;margin:5px 0}
.lock{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;place-items:center;z-index:99;padding:20px}
.lock.show{display:grid}
.badge.pro{background:#00e676;color:#000}
</style>
</head>
<body>
<div class="header">
<h2>🔥 RG OLIVEIRA GÁS</h2>
<div id="badge" style="background:#333;padding:4px 10px;border-radius:20px;display:inline-block;margin-top:5px;font-size:12px">PRO INATIVO</div>
</div>

<div id="lockScreen" class="lock">
<div class="card" style="max-width:400px;width:100%">
<h3 style="text-align:center">🔒 PRO EXPIRADO</h3>
<p style="text-align:center;margin:8px">5 vendas grátis acabaram!</p>
<div style="background:#0f1115;padding:10px;border-radius:10px">
<small>Sua chave:</small>
<b id="pixKey" style="color:#ff6a00;word-break:break-all;display:block">...</b>
<button class="btn" onclick="copiar()">📋 COPIAR CHAVE</button>
<button class="btn btn-green" onclick="jaPaguei()">✅ JÁ PAGUEI</button>
</div>
<input id="codInput" class="input" placeholder="Cole código RG-XXXX aqui">
<button class="btn" onclick="validar()">🔓 ATIVAR PRO R$39,99</button>
</div>
</div>

<div class="grid">
<div class="kpi"><small>VENDAS MÊS</small><b id="kV">R$0</b></div>
<div class="kpi"><small>A RECEBER</small><b id="kR">R$0</b></div>
<div class="kpi"><small>DESPESAS</small><b id="kD" style="color:#ff5252">R$0</b></div>
<div class="kpi"><small>LUCRO</small><b id="kL" style="color:#00e676">R$0</b></div>
</div>

<div class="card">
<h4>➕ Venda Rápida</h4>
<div class="grid">
<button class="btn" onclick="venda('GÁS P13',110)">GÁS P13 R$110</button>
<button class="btn" onclick="venda('ÁGUA',10)">ÁGUA R$10</button>
<button class="btn" onclick="venda('GÁS P8',85)">P8 R$85</button>
<button class="btn" onclick="venda('P45',380)">P45 R$380</button>
</div>
</div>

<div class="card">
<h4>👥 Clientes</h4>
<input id="nCli" class="input" placeholder="Nome cliente">
<input id="zCli" class="input" placeholder="WhatsApp">
<button class="btn" onclick="addCli()">Salvar Cliente</button>
<input id="busca" class="input" placeholder="🔍 Buscar..." oninput="render()">
<div id="lCli"></div>
</div>

<div class="card">
<h4>🧾 Vendas</h4>
<div id="lVen"></div>
<button class="btn btn-green" onclick="fechar()">📲 Fechamento no Zap</button>
</div>

<div class="card">
<button class="btn" style="background:#333" onclick="document.getElementById('admin').classList.add('show')">🔑 ADMIN</button>
<button class="btn" style="background:#333" onclick="backup()">💾 Backup</button>
</div>

<div id="admin" class="lock">
<div class="card" style="max-width:400px">
<h3>ADMIN - Senha: RgOliveira2026</h3>
<input id="sAdmin" type="password" class="input" placeholder="Senha">
<button class="btn" onclick="if(document.getElementById('sAdmin').value=='RgOliveira2026'){document.getElementById('cAdmin').style.display='block'}else alert('errada')">Entrar</button>
<div id="cAdmin" style="display:none">
<input id="cPix" class="input" placeholder="Chave cliente">
<select id="cDias" class="input"><option value="30">30 dias</option><option value="90">90 dias</option><option value="9999">Vitalício</option></select>
<button class="btn btn-green" onclick="gerar()">Gerar Código RG-</button>
<b id="cGer"></b>
</div>
<button class="btn" onclick="document.getElementById('admin').classList.remove('show')">Fechar</button>
</div>
</div>

<script>
let db=JSON.parse(localStorage.getItem('rgv3')||'{"c":[],"v":[],"key":""}');
if(!db.key){db.key=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);localStorage.setItem('rgv3',JSON.stringify(db));}
document.getElementById('pixKey').innerText=db.key;
function save(){localStorage.setItem('rgv3',JSON.stringify(db));render();}
function copiar(){if(typeof AndroidAPI!=='undefined'){AndroidAPI.copyToClipboard(db.key);AndroidAPI.vibrate(100);AndroidAPI.showToast('Copiado!');}else{navigator.clipboard.writeText(db.key);alert('Copiado: '+db.key);}}
function jaPaguei(){let m='Olá RG! Já paguei PRO. Chave:'+db.key; if(typeof AndroidAPI!=='undefined')AndroidAPI.shareText(m); else window.open('https://wa.me/5582988217147?text='+encodeURIComponent(m));}
function validar(){let c=document.getElementById('codInput').value;if(c.includes(db.key)||c.includes('MASTER')||c.startsWith('RG-')){localStorage.setItem('proAtivo',Date.now()+2592000000);document.getElementById('lockScreen').classList.remove('show');document.getElementById('badge').innerText='PRO ATIVO';document.getElementById('badge').classList.add('pro');alert('ATIVADO!');if(typeof AndroidAPI!=='undefined')AndroidAPI.showNotification('RG Oliveira','PRO Ativado!');}else alert('Código inválido');}
function check(){let a=localStorage.getItem('proAtivo');if((!a||Date.now()>+a)&&db.v.length>=5)document.getElementById('lockScreen').classList.add('show');if(a&&Date.now()<+a){document.getElementById('badge').innerText='PRO ATIVO';document.getElementById('badge').classList.add('pro');}}
function venda(p,v){let cli=prompt('Cliente?')||'Avulso';let tipo=confirm('A PRAZO? OK=Prazo / Cancelar=Vista')?'A PRAZO':'A VISTA';db.v.unshift({p,v,cli,tipo,d:new Date().toLocaleDateString()});save();check();if(typeof AndroidAPI!=='undefined'){AndroidAPI.vibrate(80);AndroidAPI.showToast(p+' vendido!');}}
function addCli(){let n=document.getElementById('nCli').value,z=document.getElementById('zCli').value;if(!n)return;db.c.push({n,z});document.getElementById('nCli').value='';save();}
function render(){let b=(document.getElementById('busca').value||'').toLowerCase();let h='';db.c.filter(x=>x.n.toLowerCase().includes(b)).forEach(x=>{h+=`<div style='display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #222'><span>${x.n}</span><button onclick='window.open("https://wa.me/55${x.z.replace(/\D/g,'')}")' style='background:#00e676;border:none;border-radius:6px;padding:4px'>Zap</button></div>`;});document.getElementById('lCli').innerHTML=h;let tot=db.v.reduce((s,x)=>s+x.v,0);let rec=db.v.filter(x=>x.tipo=='A PRAZO').reduce((s,x)=>s+x.v,0);document.getElementById('kV').innerText='R$'+tot;document.getElementById('kR').innerText='R$'+rec;document.getElementById('kL').innerText='R$'+tot;let hv='';db.v.slice(0,30).forEach(x=>{hv+=`<div style='display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #222'><small>${x.d} ${x.p} ${x.cli} (${x.tipo})</small><b>R$${x.v}</b></div>`;});document.getElementById('lVen').innerHTML=hv||'Nenhuma venda';}
function fechar(){let t=db.v.reduce((s,x)=>s+x.v,0);let m=`*FECHAMENTO RG* Vendas: R$${t} - Total: ${db.v.length}`;if(typeof AndroidAPI!=='undefined')AndroidAPI.shareText(m);else window.open('https://wa.me/?text='+encodeURIComponent(m));}
function backup(){let d='data:text/json,'+encodeURIComponent(JSON.stringify(db));let a=document.createElement('a');a.href=d;a.download='rg.json';a.click();}
function gerar(){let k=document.getElementById('cPix').value||db.key;let cod='RG-'+btoa(k).slice(0,12).toUpperCase();document.getElementById('cGer').innerText=cod;if(typeof AndroidAPI!=='undefined')AndroidAPI.copyToClipboard(cod);else navigator.clipboard.writeText(cod);}
render();check();
</script>
</body>
</html>

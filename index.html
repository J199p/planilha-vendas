<section id="despesa" class="hidden"><div class="card"><b>Despesas</b><div style="display:flex;gap:8px;margin-top:10px"><input id="dDesc" placeholder="Descricao"><input id="dValor" type="number" placeholder="Valor"><button class="btn btn-y" style="width:auto" onclick="addDespesa()">Add</button></div><div id="listaDespesas"></div></div></section>
<section id="fech" class="hidden"><div class="card"><b>Fechamento</b><div id="fechamentoBox" style="margin-top:10px"></div><button class="btn btn-y" style="margin-top:12px" onclick="baixarPDFFechamento()">PDF IGUAL PLANILHA</button><button class="btn btn-b" style="margin-top:8px" onclick="baixarRelatorioDiaPDF()">Dia PDF</button></div></section>
<section id="backup" class="hidden"><div class="card"><b>Backup</b><button class="btn btn-y" style="margin-top:10px" onclick="baixarBackup()">Backup JSON</button><button class="btn btn-g" style="margin-top:10px" onclick="baixarRelatorioDia()">TXT</button><button class="btn btn-b" style="margin-top:10px" onclick="baixarRelatorioDiaPDF()">PDF</button><input type="file" id="fileRestore" accept=".json" style="margin-top:12px"><button class="btn" style="background:#ef4444;color:#fff;margin-top:12px" onclick="apagarTudo()">Apagar tudo</button></div></section>
<script>
const K={cli:'rg_clientes',ven:'rg_vendas',desp:'rg_desp',est:'rg_est'};const $=s=>document.querySelector(s);
let cli=JSON.parse(localStorage.getItem(K.cli)||'[]');let ven=JSON.parse(localStorage.getItem(K.ven)||'[]');let desp=JSON.parse(localStorage.getItem(K.desp)||'[]');let est=JSON.parse(localStorage.getItem(K.est)||'{"gc":20,"gv":20,"ac":20,"av":20}');
function save(){localStorage.setItem(K.cli,JSON.stringify(cli));localStorage.setItem(K.ven,JSON.stringify(ven));localStorage.setItem(K.desp,JSON.stringify(desp));localStorage.setItem(K.est,JSON.stringify(est));renderAll();}
function renderAll(){renderClientes();renderVendas();renderReceber();renderDespesas();renderDash();renderFechamento();}
function getNomeProd(cod){return cod==='A'?'Agua 20L':'Gas P13';}
function renderDash(){
const hoje=new Date().toISOString().slice(0,10);
const vHoje=ven.filter(v=>v.data.startsWith(hoje));
const tHoje=vHoje.reduce((a,b)=>a+b.total,0);
const aRec=ven.reduce((a,b)=>a+b.fiado,0);
const rec=ven.reduce((a,b)=>a+b.din+b.pix+b.cart,0);
const tDesp=desp.reduce((a,b)=>a+b.valor,0);
$('#kpiVendasHoje').innerText='R$ '+tHoje.toFixed(2);
$('#kpiVendasHojeQ').innerText=vHoje.length+' venda(s)';
$('#kpiAReceber').innerText='R$ '+aRec.toFixed(2);
$('#kpiAReceberQ').innerText=ven.filter(v=>v.fiado>0).length+' contas';
$('#kpiLucro').innerText='R$ '+(rec-tDesp).toFixed(2);
$('#kpiClientes').innerText=cli.length;
$('#estGC').innerText=est.gc;$('#estGV').innerText=est.gv;$('#estAC').innerText=est.ac;$('#estAV').innerText=est.av;
const ult=[...ven].reverse().slice(0,10);
if(ult.length===0){$('#ultimasVendas').innerHTML='<small style="color:#9ca3af">Nenhuma venda</small>';return}
$('#ultimasVendas').innerHTML=ult.map(v=>{
const c=cli.find(x=>x.id==v.clienteId);const zap=c?.zap?.replace(/\D/g,'')||'';const temFiado=v.fiado>0.01;
const badge=temFiado?(v.din+v.pix+v.cart>0?'badge-yellow':'badge-red'):'badge-green';
const pago=(v.din+v.pix+v.cart);
const nomeProd=getNomeProd(v.prod);
return `<div class="item"><div style="flex:1"><small><b>${v.cliente} - ${nomeProd} ${v.qtd}x R$${v.unit.toFixed(0)} = R$ ${v.total.toFixed(2)}</b></small><br><small style="color:#fff">Pago: <b style="color:#22c55e">R$ ${pago.toFixed(2)}</b> | Fiado: <b style="color:#ef4444">R$ ${v.fiado.toFixed(2)}</b></small><br><span class="badge ${badge}">${v.status}</span></div>${temFiado&&zap?`<button class="wa-cobrar" onclick="cobrarZap('${zap}','${v.cliente}',${v.fiado})">Zap</button>`:''}</div>`;
}).join('');
}
function salvarCliente(){const n=$('#cNome').value.trim();if(!n)return alert('Nome obrigatorio');const id=cli.length?Math.max(...cli.map(c=>c.id))+1:1;cli.push({id,nome:n,zap:$('#cZap').value,end:$('#cEnd').value});$('#cNome').value='';$('#cZap').value='';$('#cEnd').value='';save();}
function renderClientes(){const q=($('#buscaCli')?.value||'').toLowerCase();const sel=$('#vCliente');sel.innerHTML='<option value="">Selecione cliente</option>';cli.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.id+' - '+c.nome;sel.appendChild(o)});$('#listaClientes').innerHTML=cli.filter(c=>c.nome.toLowerCase().includes(q)).map(c=>`<div class="item"><div><b>${c.id} - ${c.nome}</b><br><small>${c.zap}</small></div><a class="wa" href="https://wa.me/55${c.zap.replace(/\D/g,'')}" target="_blank">W</a></div>`).join('');}
function calcTotal(){const q=Math.max(1,parseFloat($('#vQtd').value||1));const unit=parseFloat($('#vUnit').value||0);let din=parseFloat($('#vDin').value||0);if(isNaN(din))din=0;let pix=parseFloat($('#vPix').value||0);if(isNaN(pix))pix=0;let cart=parseFloat($('#vCart').value||0);if(isNaN(cart))cart=0;const total=q*unit;let pago=din+pix+cart;if(pago>total){const sobra=pago-total;if(cart>=sobra){cart-=sobra;$('#vCart').value=cart>0?cart:'';}else if(pix>=sobra){pix-=sobra;$('#vPix').value=pix>0?pix:'';}else{din=Math.max(0,din-sobra);$('#vDin').value=din>0?din:'';}pago=total;}const fiado=Math.max(0,total-pago);$('#vFormula').innerText=`${q}x R$${unit.toFixed(2)} = R$${total.toFixed(2)}`;$('#vTotalAuto').innerText='R$ '+total.toFixed(2);$('#vPagoAgora').innerText='R$ '+pago.toFixed(2);$('#vFiado').innerText='R$ '+fiado.toFixed(2);return{total,fiado,din,pix,cart,q,unit};}
document.querySelectorAll('#vQtd,#vUnit,#vDin,#vPix,#vCart').forEach(e=>e.addEventListener('input',calcTotal));
document.getElementById('vProduto').addEventListener('change',function(){const v=this.value;$('#vUnit').value=v==='A'?10:86;calcTotal();});
function registrarVenda(){const idCli=$('#vCliente').value;if(!idCli)return alert('Selecione cliente');const cliObj=cli.find(c=>c.id==idCli);const {total,fiado,din,pix,cart,q,unit}=calcTotal();if(total<=0)return alert('Valor invalido');const prodCod=$('#vProduto').value;const nomeProd=getNomeProd(prodCod);ven.push({id:Date.now(),data:new Date().toISOString(),cliente:cliObj.nome,clienteId:idCli,prod:prodCod,produto:`${nomeProd} ${q}x R$${unit.toFixed(0)} = R$ ${total.toFixed(2)}`,qtd:q,unit,total,din,pix,cart,fiado,status:fiado>0.01?(din+pix+cart>0?'MISTO':'FIADO'):'PAGO'});save();alert(`${cliObj.nome} - ${nomeProd} ${q}x R$${unit} = R$ ${total.toFixed(2)} | Pago R$ ${(din+pix+cart).toFixed(2)} | Fiado R$ ${fiado.toFixed(2)} OK!`);$('#vDin').value='';$('#vPix').value='';$('#vCart').value='';calcTotal();}
function renderVendas(){$('#listaVendas').innerHTML=[...ven].reverse().slice(0,20).map(v=>{const pago=v.din+v.pix+v.cart;const nomeProd=getNomeProd(v.prod);return `<div class="item"><div><small><b>${v.cliente} - ${nomeProd} ${v.qtd}x R$${v.unit.toFixed(0)} = R$ ${v.total.toFixed(2)}</b><br>Pago R$ ${pago.toFixed(2)} | <b style="color:#ef4444">Fiado R$ ${v.fiado.toFixed(2)}</b></small></div><span class="badge ${v.fiado>0.01?'badge-red':'badge-green'}">${v.status}</span></div>`;}).join('');}
function renderReceber(){const dev=ven.filter(v=>v.fiado>0.01);const tot=dev.reduce((a,b)=>a+b.fiado,0);$('#totalReceberBadge').innerText='Total Fiado R$ '+tot.toFixed(2);if(dev.length===0){$('#listaReceber').innerHTML='<small style="color:#9ca3af">Nenhuma conta a receber - tudo pago!</small>';return}$('#listaReceber').innerHTML=dev.map(v=>{const c=cli.find(x=>x.id==v.clienteId);const zap=c?.zap?.replace(/\D/g,'')||'';const pago=v.din+v.pix+v.cart;const nomeProd=getNomeProd(v.prod);return `<div class="card" style="margin:5px 0;background:#1a1a1a"><div><b>${v.cliente}</b><br><small>${nomeProd} ${v.qtd}x R$${v.unit.toFixed(0)} = R$ ${v.total.toFixed(2)}</small><br><small>Pago: <b style="color:#22c55e">R$ ${pago.toFixed(2)}</b> | Fiado: <b style="color:#ef4444;font-size:16px">R$ ${v.fiado.toFixed(2)}</b></small></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-g" style="flex:1" onclick="receberTotal(${v.id})">RECEBER R$ ${v.fiado.toFixed(2)}</button>${zap?`<button class="wa-cobrar" onclick="cobrarZap('${zap}','${v.cliente}',${v.fiado})">Zap</button>`:''}</div></div>`;}).join('');}
function receberTotal(id){const v=ven.find(x=>x.id==id);if(!v)return;v.pix+=v.fiado;v.fiado=0;v.status='PAGO';save();}
function cobrarZap(zap,nome,valor){const msg=`Ola ${nome}! Ficou R$ ${valor.toFixed(2)} em aberto do gas. Pix 82988217714. GRUPO EL SHADAI GAS agradece!`;window.open(`https://wa.me/55${zap}?text=${encodeURIComponent(msg)}`,'_blank');}
function salvarEstoque(){est={gc:parseInt($('#eGC').value)||0,gv:parseInt($('#eGV').value)||0,ac:parseInt($('#eAC').value)||0,av:parseInt($('#eAV').value)||0};save();alert(`Estoque salvo`);}
function addDespesa(){const d=$('#dDesc').value;const vv=parseFloat($('#dValor').value);if(!d||!vv)return;desp.push({data:new Date().toISOString().slice(0,10),desc:d,valor:vv});$('#dDesc').value='';$('#dValor').value='';save();}
function renderDespesas(){$('#listaDespesas').innerHTML=desp.map(d=>`<div class="item"><small>${d.data} - ${d.desc}</small><b>R$ ${d.valor.toFixed(2)}</b></div>`).join('');}
function renderFechamento(){const agora=new Date();const mes=agora.getMonth();const ano=agora.getFullYear();const vMes=ven.filter(v=>{const d=new Date(v.data);return d.getMonth()===mes&&d.getFullYear()===ano});const bruto=vMes.reduce((a,b)=>a+b.total,0);const rec=vMes.reduce((a,b)=>a+b.din+b.pix+b.cart,0);const aRec=vMes.reduce((a,b)=>a+b.fiado,0);const qtdGas=vMes.reduce((a,b)=>a+b.qtd,0);const tDesp=desp.filter(d=>{const dd=new Date(d.data);return dd.getMonth()===mes&&dd.getFullYear()===ano}).reduce((a,b)=>a+b.valor,0);$('#fechamentoBox').innerHTML=`<div>Qtd Gas: <b>${qtdGas}</b> | Bruto: <b>R$ ${bruto.toFixed(2)}</b></div><div>Recebido: <b style="color:#22c55e">R$ ${rec.toFixed(2)}</b></div><div>A receber: <b style="color:#ef4444">R$ ${aRec.toFixed(2)}</b></div><div>Lucro: <b>R$ ${(rec-tDesp).toFixed(2)}</b></div>`;window._fech={bruto,rec,aRec,tDesp,qtdGas,vMes,mes:agora.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),dataStr:new Date().toLocaleDateString('pt-BR')};}
function baixarPDFFechamento(){const {jsPDF}=window.jspdf;const doc=new jsPDF('landscape','mm','a4');const d=window._fech;const titulo=`EL SHADAI - MES - GAS: ${d.qtdGas} - TOTAL R$${d.bruto.toFixed(0)} - ${d.dataStr}`;doc.setFontSize(10);doc.text(titulo,14,10);const cols=[{header:'DATA',dataKey:'data'},{header:'Cliente',dataKey:'cliente'},{header:'Prod',dataKey:'prod'},{header:'Qtd',dataKey:'qtd'},{header:'Unit',dataKey:'unit'},{header:'Total',dataKey:'total'},{header:'PIX',dataKey:'pix'},{header:'DH',dataKey:'dh'},{header:'CART',dataKey:'cart'},{header:'FIADO',dataKey:'fiado'}];const rows=d.vMes.map(v=>({data:new Date(v.data).toLocaleDateString('pt-BR'),cliente:v.cliente,prod:getNomeProd(v.prod),qtd:v.qtd,unit:`R$${v.unit.toFixed(0)}`,total:`R$${v.total.toFixed(0)}`,pix:`R$${v.pix.toFixed(0)}`,dh:`R$${v.din.toFixed(0)}`,cart:`R$${v.cart.toFixed(0)}`,fiado:`R$${v.fiado.toFixed(0)}`}));doc.autoTable({head:[cols.map(c=>c.header)],body:rows.map(r=>cols.map(c=>r[c.dataKey])),startY:14,styles:{fontSize:8,halign:'center',cellPadding:2},headStyles:{fillColor:[37,99,235],textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:[240,240,240]},theme:'grid'});doc.save(`${titulo}.pdf`);}
function gerarRelatorioDia(){const hoje=new Date().toISOString().slice(0,10);const vHoje=ven.filter(v=>v.data.startsWith(hoje));const tot=vHoje.reduce((a,b)=>a+b.total,0);const rec=vHoje.reduce((a,b)=>a+b.din+b.pix+b.cart,0);const fiado=vHoje.reduce((a,b)=>a+b.fiado,0);let txt=`GRUPO EL SHADAI GAS - RELATORIO ${new Date().toLocaleDateString()}\n`;vHoje.forEach(v=>{txt+=`${v.cliente} | ${getNomeProd(v.prod)} | Qtd ${v.qtd} | Unit R$${v.unit} | Total R$${v.total} | Pix R$${v.pix} | DH R$${v.din} | Fiado R$${v.fiado}\n`;});txt+=`\nBruto R$${tot} Recebido R$${rec} Fiado R$${fiado}\n`;return{txt,hoje,vHoje,tot,rec,fiado};}
function baixarRelatorioDia(){const {txt,hoje}=gerarRelatorioDia();const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`relatorio_${hoje}.txt`;a.click();}
function baixarRelatorioDiaPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF('landscape');const {vHoje,hoje}=gerarRelatorioDia();const titulo=`EL SHADAI - DIA - GAS: ${vHoje.reduce((a,b)=>a+b.qtd,0)} - TOTAL R$${vHoje.reduce((a,b)=>a+b.total,0)} - ${new Date().toLocaleDateString('pt-BR')}`;doc.text(titulo,14,10);const cols=['DATA','Cliente','Prod','Qtd','Unit','Total','PIX','DH','CART','FIADO'];const rows=vHoje.map(v=>[new Date(v.data).toLocaleDateString('pt-BR'),v.cliente,getNomeProd(v.prod),v.qtd,`R$${v.unit}`,`R$${v.total}`,`R$${v.pix}`,`R$${v.din}`,`R$${v.cart}`,`R$${v.fiado}`]);doc.autoTable({head:[cols],body:rows,startY:14,styles:{fontSize:8,halign:'center'},headStyles:{fillColor:[37,99,235]}});doc.save(`${titulo}.pdf`);}
function baixarBackup(){const data={clientes:cli,vendas:ven,despesas:desp,estoque:est,relatorio:gerarRelatorioDia().txt,data:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup_el_shadai_${new Date().toISOString().slice(0,10)}.json`;a.click();}
function apagarTudo(){if(confirm('Apagar tudo?')){localStorage.clear();cli=[];ven=[];desp=[];est={gc:20,gv:20,ac:20,av:20};save();}}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById(t.dataset.tab).classList.remove('hidden');}));
renderAll();calcTotal();
</script>
</body>
</html>
